name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chatpan
          POSTGRES_PASSWORD: chatpan_local
          POSTGRES_DB: chatpan
        ports: ["5432:5432"]
        options: >-
          --health-cmd 'pg_isready -U chatpan'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://chatpan:chatpan_local@localhost:5432/chatpan
      APP_URL: http://localhost:3000
      E2E_PRODUCTION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: npm ci
      - run: node scripts/local-env.mjs
      - run: npm run db:generate && npm run db:migrate
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
