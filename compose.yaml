services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chatpan
      POSTGRES_PASSWORD: chatpan_local
      POSTGRES_DB: chatpan
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - chatpan_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatpan"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  chatpan_pg:
